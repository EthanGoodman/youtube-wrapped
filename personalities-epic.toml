# Player personalities for Epic Games Wrapped stories (the same as Steam's to start). Edit freely;
# reload the Wrapped page to see changes.
#
# Same rules as personalities.toml: each personality looks at one metric for the year, its score is
# value / threshold, and the highest score wins if it reaches 1. Otherwise the fallback is used.
#
# Metrics (all for the chosen year; shares are 0..1). Game platforms only say your lifetime hours per game, never
# when you played, so the year is read from your achievement unlocks: each one is a real, timestamped moment of play.
#   top_game_share     unlocks in your #1 game / all unlocks
#   games_count        how many different games you unlocked achievements in
#   new_game_share     unlocks in games you started this year (not used in your first year of data)
#   achievements       achievements unlocked
#   rare_achievements  unlocks that fewer than 10% of players have
#   weekend_share      unlocks on Saturday or Sunday (an even spread is ~0.29)
#   night_share        unlocks between midnight and 5am
#   active_days        days you unlocked something
#
# In `reason`, {pct} is the value as a percentage, {value} the number rounded, {value1} with one decimal.

[[personality]]
id = "devoted"
name = "The Devoted"
emoji = "🛡️"
color = "#6E4C7E"
metric = "top_game_share"
threshold = 0.6
tagline = "One game. Every evening."
reason = "{pct} of your achievements came from a single game."

[[personality]]
id = "sampler"
name = "The Sampler"
emoji = "🎲"
color = "#4C7DA8"
metric = "games_count"
threshold = 8
tagline = "So many games, so little time."
reason = "You unlocked achievements in {value} different games this year."

[[personality]]
id = "trailblazer"
name = "The New-Game Hunter"
emoji = "🧭"
color = "#8A8B3C"
metric = "new_game_share"
threshold = 0.6
tagline = "The backlog fears you."
reason = "{pct} of your achievements were in games you started this year."

[[personality]]
id = "completionist"
name = "The Completionist"
emoji = "🏆"
color = "#E2A93B"
metric = "achievements"
threshold = 60
tagline = "If there's a checkbox, it gets ticked."
reason = "You unlocked {value} achievements this year."

[[personality]]
id = "elite"
name = "The Elite"
emoji = "💎"
color = "#2E6B63"
metric = "rare_achievements"
threshold = 3
tagline = "Rare air."
reason = "{value} of your achievements this year are ones fewer than 1 in 10 players have."

[[personality]]
id = "weekend"
name = "The Weekend Warrior"
emoji = "🎮"
color = "#B83A24"
metric = "weekend_share"
threshold = 0.5
tagline = "Weekdays are for waiting."
reason = "{pct} of your achievements were unlocked on weekends."

[[personality]]
id = "night_owl"
name = "The Night Raider"
emoji = "🌙"
color = "#2F4A7A"
metric = "night_share"
threshold = 0.2
tagline = "One more round. It's 3am."
reason = "{pct} of your achievements were unlocked after midnight."

[[personality]]
id = "regular"
name = "The Regular"
emoji = "📅"
color = "#A34E6E"
metric = "active_days"
threshold = 40
tagline = "Always something on the go."
reason = "You unlocked something on {value} different days."

[fallback]
id = "casual"
name = "The Casual"
emoji = "🕹️"
color = "#2E6B63"
tagline = "Games when you feel like it."
reason = "No single habit ran your year: a bit of everything, when it suited you."
