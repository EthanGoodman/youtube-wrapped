version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # rewrites, not upgrades: each needs its own migration task (both break the build as-is)
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: framer-motion
        update-types: [version-update:semver-major]
    groups:
      npm-minor:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
