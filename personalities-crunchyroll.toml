# Viewer personalities for the Crunchyroll Wrapped story. Edit freely; reload the Wrapped page to see changes.
#
# Same rules as personalities.toml: each personality looks at one metric for the year, its score is
# value / threshold, and the highest score wins if it reaches 1. Otherwise the fallback is used.
#
# Metrics (all for the chosen year; shares are 0..1, of episodes):
#   sub_share / dub_share   watched in Japanese with subtitles / in another language
#   simulcast_share         watched within a week of the episode airing
#   shounen_share, isekai_share, romance_share, slice_of_life_share, sports_share, psychological_share
#                           episodes of series AniList tags (or genres) that way
#   binge_day_share         share of your days with 5+ episodes of one series
#   finish_rate / drop_rate series finished / dropped, of those you watched
#   top_show_share          episodes from your #1 series
#   night_share             episodes started between midnight and 5am
#   weekend_share           episodes on Saturday or Sunday
#
# In `reason`, {pct} is the value as a percentage, {value} the number rounded, {value1} with one decimal.

[[personality]]
id = "simulcast_chaser"
name = "The Simulcast Chaser"
emoji = "⏱️"
color = "#ff640a"
metric = "simulcast_share"
threshold = 0.25
tagline = "New episode drops? You're already watching."
reason = "{pct} of your episodes were watched within a week of airing."

